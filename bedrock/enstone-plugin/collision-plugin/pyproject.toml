[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-collision-extractor"
version = "2.1.0"
description = "Collision shape extractor plugin for Endstone"
requires-python = ">=3.9"
dependencies = ["endstone>=0.6.0"]

[project.entry-points."endstone"]
collision_extractor = "collision_extractor:CollisionExtractor"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["build*", "dist*", "*.egg-info*"]

[tool.setuptools]
include-package-data = false
